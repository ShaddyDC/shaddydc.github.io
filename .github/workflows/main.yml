name: Update website

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

# Default to bash
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: cachix/install-nix-action@v31

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Generate git history
        run: python3 scripts/generate-git-history.py

      - name: Check KaTeX CSS matches Hugo
        run: |
          nix develop -c python3 scripts/sync-katex-css.py
          if [ -n "$(git status --porcelain -- shaddy.dev/static)" ]; then
            echo "::error::Vendored KaTeX CSS doesn't match Hugo's KaTeX; run scripts/sync-katex-css.py"
            exit 1
          fi

      - name: Build
        run: |
          cd shaddy.dev && nix develop -c hugo --gc --minify

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./shaddy.dev/public

  # Deployment job
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
