baseURL = "https://shaddy.dev/"
locale = "en-gb"
title = "Shaddy's"

defaultContentLanguage = "en-gb"
enableGitInfo = true

# Git author dates are unreliable here (see partials/helpers/lastmod.html), so
# keep .Lastmod off git; templates use the commit date via that helper instead.
[frontmatter]
lastmod = ["lastmod", "date", "publishDate"]

[markup]
[markup.highlight]
noClasses = false
[markup.goldmark.renderer]
unsafe = true
[markup.tableOfContents]
startLevel = 2
endLevel = 3

[menu]
[[menu.main]]
# The page reference (pageRef) is useful for menu highlighting
# When pageRef is set, setting `url` is optional; it will be used as a fallback if the page is not found.
pageRef = "/"
name = 'Home'
url = '/'
weight = 10
[[menu.main]]
pageRef = "posts"
name = 'Posts'
url = '/posts/'
weight = 20
[[menu.main]]
pageRef = "projects"
name = 'Projects'
url = '/projects/'
weight = 30
[[menu.main]]
pageRef = "notes"
name = 'Notes'
url = '/notes/'
weight = 30
[[menu.main]]
pageRef = "about"
name = 'About'
url = '/about/'
weight = 40

[params]
sitename = "Shaddy's"
defaultColor = "auto"
description = "A place to dump thoughts"
mainSections = ['posts']

[params.author]
avatar = "avatar.png" # put the file in assets folder; also ensure that image has same height and width
# Note: image is not rendered if the resource(avatar image) is not found. No error is displayed.
intro = "Shaddy's"
name = "Shaddy"
mail = "blog@shaddy.dev"
description = "Have you always wanted to read what such an important person as me has to say? Well, maybe you can find it here."

[[params.socialIcons]]
name = "github"
url = "https://github.com/ShaddyDC"

[[params.socialIcons]]
name = "RSS"
url = "/feeds"

# Project pages are just redirects to the repos; keep them out of the sitemap
[[cascade]]
[cascade.sitemap]
disable = true
[cascade.target]
path = "/projects/**"
