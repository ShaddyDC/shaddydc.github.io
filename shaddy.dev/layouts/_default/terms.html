{{- define "main" -}}
<div class="wrapper list-page">
    <header class="header">
        <h1 class="header-title center">{{ .Title }}</h1>
    </header>
    <main class="page-content" aria-label="Content">
        <ul class="post-tags">
            {{- range .Data.Terms.Alphabetical }}
            <li><a class="tag-item" href="{{ .Page.RelPermalink }}">{{ .Page.LinkTitle }} ({{ .Count }})</a></li>
            {{- end }}
        </ul>
    </main>
</div>
{{- end -}}
