{{ define "main" }}
<div class="wrapper post">
  <main class="page-content" aria-label="Content">
    <article>
      <header class="header">
        <h1 class="header-title">{{ .Title }}</h1>
        {{ $ISO_time := dateFormat "2006-01-02T15:04:05-07:00" .Date }}
        <div class="post-meta">
          <time datetime="{{ $ISO_time }}" itemprop="datePublished">
            {{ .Date | time.Format ":date_medium" }}
          </time>
          {{- with .GetTerms "tags" }}
          <ul class="post-tags">
            {{- range . }}
            <li><a class="tag-item" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></li>
            {{- end }}
          </ul>
          {{- end }}
        </div>
      </header>
      <div class="page-content">{{ .Content }}</div>
      {{- partial "git-history.html" . -}}
    </article>
  </main>
</div>
{{ end }}
